[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ponderada-metricas-cicd"
version = "0.1.0"
description = "Experimento de metricas de CI/CD com GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "junitparser>=3.2.0",
  "matplotlib>=3.9.0",
  "pandas>=2.2.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pandas-stubs>=2.2.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=ci_metrics --cov-report=xml:coverage.xml"
testpaths = ["tests"]
markers = [
  "slow: testes com espera artificial controlada",
  "expanded: testes parametrizados para aumentar volume",
  "experimental_failure: falha controlada para medir feedback do pipeline",
]
